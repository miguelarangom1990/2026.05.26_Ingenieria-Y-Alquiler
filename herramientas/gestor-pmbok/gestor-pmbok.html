<script>
/* ==========================================================================
   05-calc.js — cálculos compartidos: EDT (códigos y consolidación), método de
   la ruta crítica (CPM) sobre calendario laboral, valor ganado (EVM),
   líneas base, riesgos y revisiones de documentos. Funciones puras.
   ========================================================================== */
(function () {
  'use strict';
  const PM = window.PM;
  const D = PM.date;
  const num = PM.num;
  const calc = (PM.calc = {});

  /* ---------------------------------------------------------------- EDT */
  /* nodes: [{id, parentId|null, name, order, ...}]. Raíz implícita = el proyecto (código "1"). */
  calc.wbsTree = function (nodes) {
    const list = (nodes || []).filter((n) => n && n.id);
    const byId = new Map(list.map((n) => [n.id, n]));
    const children = new Map();
    const keyOf = (pid) => (pid && byId.has(pid) ? pid : 'root');
    for (const n of list) { const k = keyOf(n.parentId); if (!children.has(k)) children.set(k, []); children.get(k).push(n); }
    for (const arr of children.values()) arr.sort((a, b) => num(a.order) - num(b.order) || String(a.name || '').localeCompare(String(b.name || '')));
    const codes = new Map(), depth = new Map(), flat = [], leaves = new Set(), parentOf = new Map();
    const seen = new Set();
    const walk = (key, prefix, d) => {
      (children.get(key) || []).forEach((n, i) => {
        if (seen.has(n.id)) return; seen.add(n.id);
        const code = prefix + '.' + (i + 1);
        codes.set(n.id, code); depth.set(n.id, d); parentOf.set(n.id, key === 'root' ? null : key);
        const isLeaf = !(children.get(n.id) || []).length;
        if (isLeaf) leaves.add(n.id);
        flat.push({ node: n, code, depth: d, isLeaf });
        walk(n.id, code, d + 1);
      });
    };
    walk('root', '1', 1);
    /* nodos huérfanos por ciclos: se agregan al final como raíz */
    for (const n of list) if (!seen.has(n.id)) { seen.add(n.id); const code = '1.' + ((children.get('root') || []).length + 1); codes.set(n.id, code); depth.set(n.id, 1); flat.push({ node: n, code, depth: 1, isLeaf: true }); leaves.add(n.id); }
    const descendants = (id) => { const out = []; const st = [...(children.get(id) || [])]; while (st.length) { const x = st.pop(); out.push(x.id); st.push(...(children.get(x.id) || [])); } return out; };
    const ancestors = (id) => { const out = []; let p = parentOf.get(id); while (p) { out.push(p); p = parentOf.get(p); } return out; };
    return { nodes: list, byId, children, codes, depth, flat, leaves, parentOf, descendants, ancestors, rootCode: '1', childrenOf: (id) => children.get(id || 'root') || [] };
  };

  /* ---------------------------------------------------------------- planificado vs fecha */
  /* Fracción planificada de una actividad al cierre del día `at`. */
  calc.plannedFraction = function (cal, start, finish, milestone, at) {
    if (!D.valid(start) || !D.valid(at)) return 0;
    if (milestone) return at >= start ? 1 : 0;
    if (!D.valid(finish) || finish < start) finish = start;
    if (at < start) return 0;
    if (at >= finish) return 1;
    const total = cal.countWork(start, finish);
    if (total <= 0) return at >= finish ? 1 : 0;
    return Math.min(1, cal.countWork(start, at) / total);
  };

  /* ---------------------------------------------------------------- CPM
     schedule = { settings:{workweek, holidaysCO, extraHolidays}, tasks:[{id,name,wbsId,duration,milestone,start,deps:[{id,type,lag}],progress,cost,resources,actualStart,actualFinish,...}] }
     Tiempo en "puntos" de días hábiles: la actividad ocupa [es, ef); ef = es + duración.
     Hito: duración 0; su fecha es el cierre del día hábil anterior a es (o el primer día si es = 0). */
  calc.computeSchedule = function (schedule, projectStart) {
    const settings = (schedule && schedule.settings) || {};
    const raw = ((schedule && schedule.tasks) || []).filter((t) => t && t.id);
    const anchor = D.valid(projectStart) ? projectStart : D.min(...raw.map((t) => t.start).filter(D.valid)) || D.today();
    const cal = PM.cal.make(settings, anchor);
    const byIdRaw = new Map(raw.map((t) => [t.id, t]));
    const preds = new Map(), succs = new Map(), errors = [];
    for (const t of raw) { preds.set(t.id, []); succs.set(t.id, []); }
    for (const t of raw) {
      for (const dep of t.deps || []) {
        if (!dep || !byIdRaw.has(dep.id) || dep.id === t.id) continue;
        if (preds.get(t.id).some((p) => p.id === dep.id)) continue;
        const type = ['FS', 'SS', 'FF', 'SF'].includes(dep.type) ? dep.type : 'FS';
        const lag = Math.round(num(dep.lag));
        preds.get(t.id).push({ id: dep.id, type, lag });
        succs.get(dep.id).push({ id: t.id, type, lag });
      }
    }
    /* orden topológico (Kahn) estable respecto al orden de la lista */
    const indeg = new Map(raw.map((t) => [t.id, preds.get(t.id).length]));
    const order = []; const queue = raw.filter((t) => indeg.get(t.id) === 0).map((t) => t.id); const done = new Set();
    while (queue.length) { const id = queue.shift(); if (done.has(id)) continue; done.add(id); order.push(id); for (const s of succs.get(id)) { indeg.set(s.id, indeg.get(s.id) - 1); if (indeg.get(s.id) === 0) queue.push(s.id); } }
    const cyclic = raw.filter((t) => !done.has(t.id)).map((t) => t.id);
    if (cyclic.length) { errors.push({ type: 'cycle', ids: cyclic, message: 'Hay dependencias circulares entre ' + cyclic.length + ' actividades; se ignoraron esos vínculos.' }); order.push(...cyclic); }
    const cycSet = new Set(cyclic);
    const R = new Map();
    for (const id of order) {
      const t = byIdRaw.get(id);
      const ms = !!t.milestone || num(t.duration, 0) <= 0;
      let d = ms ? 0 : Math.max(1, Math.round(num(t.duration, 1)));
      let es = 0;
      if (D.valid(t.start)) es = Math.max(es, cal.indexOf(t.start) + (ms ? 1 : 0));
      for (const p of preds.get(id)) {
        if (cycSet.has(id) && cycSet.has(p.id)) continue;
        const r = R.get(p.id); if (!r) continue;
        if (p.type === 'FS') es = Math.max(es, r.ef + p.lag);
        else if (p.type === 'SS') es = Math.max(es, r.es + p.lag);
        else if (p.type === 'FF') es = Math.max(es, r.ef + p.lag - d);
        else es = Math.max(es, r.es + p.lag - d);
      }
      let actual = false;
      if (D.valid(t.actualStart)) { es = cal.indexOf(t.actualStart) + (ms ? 1 : 0); actual = true; }
      let ef = es + d;
      if (D.valid(t.actualFinish) && num(t.progress) >= 100) { const f = cal.indexOf(t.actualFinish) + 1; if (ms) { es = f; ef = f; } else { ef = Math.max(es + 1, f); d = ef - es; } actual = true; }
      R.set(id, { es, ef, d, ms, actual });
    }
    let minES = Infinity, maxEF = -Infinity;
    for (const r of R.values()) { minES = Math.min(minES, r.es); maxEF = Math.max(maxEF, r.ef); }
    if (!R.size) { minES = 0; maxEF = 0; }
    for (let k = order.length - 1; k >= 0; k--) {
      const id = order[k]; const r = R.get(id);
      let lf = maxEF;
      for (const s of succs.get(id)) {
        if (cycSet.has(id) && cycSet.has(s.id)) continue;
        const q = R.get(s.id); if (!q || q.ls === undefined) continue;
        if (s.type === 'FS') lf = Math.min(lf, q.ls - s.lag);
        else if (s.type === 'SS') lf = Math.min(lf, q.ls - s.lag + r.d);
        else if (s.type === 'FF') lf = Math.min(lf, q.lf - s.lag);
        else lf = Math.min(lf, q.lf - s.lag + r.d);
      }
      r.lf = lf; r.ls = lf - r.d; r.tf = r.ls - r.es;
      let ff = Infinity, hasSucc = false;
      for (const s of succs.get(id)) {
        const q = R.get(s.id); if (!q) continue; hasSucc = true;
        if (s.type === 'FS') ff = Math.min(ff, q.es - s.lag - r.ef);
        else if (s.type === 'SS') ff = Math.min(ff, q.es - s.lag - r.es);
        else if (s.type === 'FF') ff = Math.min(ff, q.ef - s.lag - r.ef);
        else ff = Math.min(ff, q.ef - s.lag - r.es);
      }
      r.ff = hasSucc ? Math.max(0, Math.min(ff, r.tf)) : Math.max(0, maxEF - r.ef);
    }
    const msDate = (i) => cal.dateOf(i > 0 ? i - 1 : i);
    const tasks = raw.map((t) => {
      const r = R.get(t.id);
      const startDate = r.ms ? msDate(r.es) : cal.dateOf(r.es);
      const finishDate = r.ms ? startDate : cal.dateOf(r.ef - 1);
      const lateStart = r.ms ? msDate(r.ls) : cal.dateOf(r.ls);
      const lateFinish = r.ms ? lateStart : cal.dateOf(r.lf - 1);
      const progress = PM.clamp(num(t.progress), 0, 100);
      return { ...t, milestone: r.ms, duration: r.d, es: r.es, ef: r.ef, ls: r.ls, lf: r.lf, tf: r.tf, ff: r.ff, critical: r.tf <= 0 && progress < 100, actual: r.actual, startDate, finishDate, lateStart, lateFinish, progress, preds: preds.get(t.id), succs: succs.get(t.id) };
    });
    const byId = new Map(tasks.map((t) => [t.id, t]));
    const start = tasks.length ? D.min(...tasks.map((t) => t.startDate)) : cal.anchor;
    const finish = tasks.length ? D.max(...tasks.map((t) => t.finishDate)) : cal.anchor;
    return { cal, tasks, byId, order, start, finish, startIdx: minES, finishIdx: maxEF, workdays: Math.max(0, maxEF - minES), criticalIds: new Set(tasks.filter((t) => t.critical).map((t) => t.id)), errors, settings: cal.settings };
  };

  /* Consolidado por nodo de la EDT: fechas, costo y avance (ponderado por costo; si no hay costo, por duración). */
  calc.rollupWbs = function (tree, sched) {
    const out = new Map();
    const direct = new Map();
    for (const t of (sched && sched.tasks) || []) { if (!t.wbsId) continue; if (!direct.has(t.wbsId)) direct.set(t.wbsId, []); direct.get(t.wbsId).push(t); }
    const agg = (id) => {
      if (out.has(id)) return out.get(id);
      const tasks = [...(direct.get(id) || [])];
      for (const c of tree.childrenOf(id)) { const sub = agg(c.id); tasks.push(...sub.tasks); }
      const cost = PM.sum(tasks, (t) => num(t.cost));
      const weight = cost > 0 ? (t) => num(t.cost) : (t) => Math.max(1, t.duration);
      const wsum = PM.sum(tasks, weight);
      const progress = wsum > 0 ? PM.sum(tasks, (t) => weight(t) * t.progress) / wsum : 0;
      const r = { tasks, cost, progress, count: tasks.length, start: tasks.length ? D.min(...tasks.map((t) => t.startDate)) : null, finish: tasks.length ? D.max(...tasks.map((t) => t.finishDate)) : null, critical: tasks.some((t) => t.critical) };
      out.set(id, r); return r;
    };
    for (const n of tree.nodes) agg(n.id);
    return out;
  };

  /* ---------------------------------------------------------------- líneas base
     docs = [{id, data}] de projects/{pid}/baselines. data: {number, label, date, includes:['scope','schedule','cost'], note, changeRef, byId, scope, schedule, cost} */
  calc.activeBaselines = function (docs) {
    const list = (docs || []).filter((d) => d && d.data).map((d) => ({ id: d.id, ...d.data })).sort((a, b) => num(b.number) - num(a.number) || String(b.date).localeCompare(String(a.date)));
    const pick = (k) => list.find((b) => (b.includes || []).includes(k)) || null;
    return { list, scope: pick('scope'), schedule: pick('schedule'), cost: pick('cost'), latest: list[0] || null };
  };
  calc.nextBaselineNumber = (docs) => (docs || []).reduce((m, d) => Math.max(m, num(d.data && d.data.number, -1)), -1) + 1;
  /* Construye la instantánea de una línea base a partir del estado actual. */
  calc.makeBaselineSnapshot = function ({ includes, sched, wbs, costs, scopeStatement }) {
    const inc = includes && includes.length ? includes : ['scope', 'schedule', 'cost'];
    const tasks = ((sched && sched.tasks) || []).map((t) => ({ id: t.id, name: t.name || '', wbsId: t.wbsId || null, start: t.startDate, finish: t.finishDate, duration: t.duration, milestone: !!t.milestone, cost: num(t.cost) }));
    const out = { includes: inc };
    if (inc.includes('scope')) out.scope = { wbs: PM.clone((wbs && wbs.nodes) || []), scopeStatement: scopeStatement ? PM.clone(scopeStatement) : null };
    if (inc.includes('schedule')) out.schedule = { start: sched ? sched.start : null, finish: sched ? sched.finish : null, tasks };
    if (inc.includes('cost')) {
      const reserves = (costs && costs.reserves) || {};
      out.cost = { bac: PM.sum(tasks, (t) => t.cost), contingency: num(reserves.contingency), management: num(reserves.management), tasks: tasks.map(({ id, name, start, finish, milestone, cost }) => ({ id, name, start, finish, milestone, cost })) };
    }
    return out;
  };

  /* ---------------------------------------------------------------- valor ganado (EVM)
     sched: resultado de computeSchedule (actual). costBaseline: objeto de línea base (con .cost) o null.
     costs: { actuals:[{id,date,amount,taskId,description,category}], statusUpdates:[{id,date,progress:{taskId:pct},note}], reserves:{contingency,management} } */
  calc.evm = function ({ sched, costBaseline, costs, statusDate }) {
    const cal = sched.cal;
    const at = D.valid(statusDate) ? statusDate : D.today();
    const fromBaseline = !!(costBaseline && costBaseline.cost && Array.isArray(costBaseline.cost.tasks));
    const plan = fromBaseline
      ? costBaseline.cost.tasks.map((b) => ({ id: b.id, name: b.name, start: b.start, finish: b.finish, milestone: !!b.milestone, cost: num(b.cost) }))
      : sched.tasks.map((t) => ({ id: t.id, name: t.name, start: t.startDate, finish: t.finishDate, milestone: t.milestone, cost: num(t.cost) }));
    const budget = new Map(plan.map((p) => [p.id, p.cost]));
    const bac = PM.sum(plan, (p) => p.cost);
    const pvAt = (date) => PM.sum(plan, (p) => p.cost * calc.plannedFraction(cal, p.start, p.finish, p.milestone, date));
    const evFrom = (prog) => { let s = 0; for (const [id, b] of budget) s += b * PM.clamp(num(prog[id]), 0, 100) / 100; return s; };
    const curProg = {}; for (const t of sched.tasks) curProg[t.id] = t.progress;
    const planStart = plan.length ? D.min(...plan.map((p) => p.start)) : sched.start;
    const planFinish = plan.length ? D.max(...plan.map((p) => p.finish)) : sched.finish;
    /* historial de avance */
    const updates = ((costs && costs.statusUpdates) || []).filter((u) => u && D.valid(u.date) && u.date <= at).sort((a, b) => (a.date < b.date ? -1 : 1));
    let carry = {}; const evPts = [];
    if (D.valid(planStart)) evPts.push({ date: D.add(planStart, -1), ev: 0 });
    for (const u of updates) { carry = { ...carry, ...(u.progress || {}) }; evPts.push({ date: u.date, ev: evFrom(carry) }); }
    const ev = evFrom(curProg);
    while (evPts.length && evPts[evPts.length - 1].date >= at) evPts.pop();
    evPts.push({ date: at, ev });
    const evAt = (date) => { if (date >= at) return ev; let prev = evPts[0]; if (!prev || date <= prev.date) return 0; for (const p of evPts) { if (p.date === date) return p.ev; if (p.date > date) { const span = D.diff(prev.date, p.date) || 1; return prev.ev + (p.ev - prev.ev) * (D.diff(prev.date, date) / span); } prev = p; } return prev.ev; };
    /* costos reales */
    const actuals = ((costs && costs.actuals) || []).filter((a) => a && D.valid(a.date)).sort((a, b) => (a.date < b.date ? -1 : 1));
    const acAt = (date) => PM.sum(actuals.filter((a) => a.date <= date), (a) => num(a.amount));
    const ac = acAt(at);
    const pv = pvAt(at);
    /* serie semanal */
    const dates = new Set();
    if (D.valid(planStart)) {
      const end = D.max(planFinish, at);
      let d = D.add(planStart, -1); dates.add(d);
      let guard = 0; while (d < end && guard++ < 1200) { d = D.add(d, 7); dates.add(d < end ? d : end); }
      dates.add(planFinish); dates.add(at);
      for (const u of updates) dates.add(u.date);
    }
    const series = [...dates].filter(D.valid).sort().map((date) => ({ date, pv: pvAt(date), ev: date <= at ? evAt(date) : null, ac: date <= at ? acAt(date) : null }));
    const spi = pv > 0 ? ev / pv : null;
    const cpi = ac > 0 ? ev / ac : null;
    const eac = cpi ? bac / cpi : null;
    const eacAtypical = ac + (bac - ev);
    const eacComposite = cpi && spi ? ac + (bac - ev) / (cpi * spi) : null;
    /* cronograma ganado (earned schedule), en días hábiles */
    let esWd = null, atWd = null, spiT = null, forecastFinish = null, pdWd = null;
    if (D.valid(planStart) && D.valid(planFinish) && bac > 0) {
      pdWd = cal.countWork(planStart, planFinish);
      atWd = at < planStart ? 0 : cal.countWork(planStart, at);
      let i = 0, prevPv = 0, found = null; let day = planStart; let guard = 0;
      while (day <= planFinish && guard++ < 6000) { if (cal.isWork(day)) { i++; const p = pvAt(day); if (p >= ev - 1e-6) { const frac = p - prevPv > 0 ? (ev - prevPv) / (p - prevPv) : 1; found = i - 1 + PM.clamp(frac, 0, 1); break; } prevPv = p; } day = D.add(day, 1); }
      esWd = found === null ? pdWd : found;
      spiT = atWd > 0 ? esWd / atWd : null;
      if (spiT && spiT > 0) { const ieac = pdWd / spiT; forecastFinish = cal.addWork(planStart, Math.max(0, Math.ceil(ieac) - 1)); }
    }
    const reserves = (costBaseline && costBaseline.cost) ? { contingency: num(costBaseline.cost.contingency), management: num(costBaseline.cost.management) } : { contingency: num(costs && costs.reserves && costs.reserves.contingency), management: num(costs && costs.reserves && costs.reserves.management) };
    return {
      statusDate: at, fromBaseline, bac, pv, ev, ac, sv: ev - pv, cv: ev - ac, spi, cpi, eac, eacAtypical, eacComposite,
      etc: eac !== null ? eac - ac : null, vac: eac !== null ? bac - eac : null,
      tcpi: bac - ac !== 0 ? (bac - ev) / (bac - ac) : null, tcpiEac: eac !== null && eac - ac !== 0 ? (bac - ev) / (eac - ac) : null,
      pctPlanned: bac ? pv / bac : 0, pctComplete: bac ? ev / bac : 0, pctSpent: bac ? ac / bac : 0,
      planStart, planFinish, series, pvAt, evAt, acAt, esWd, atWd, pdWd, spiT, forecastFinish,
      costBaseline: bac + reserves.contingency, totalBudget: bac + reserves.contingency + reserves.management, reserves,
      evPoints: evPts, actualsCount: actuals.length,
    };
  };
  /* Tono para índices de desempeño (CPI/SPI) */
  calc.indexTone = (v) => (v === null || v === undefined || !Number.isFinite(v) ? null : v >= 0.98 ? 'good' : v >= 0.9 ? 'warn' : 'crit');

  /* ---------------------------------------------------------------- riesgos (escala 1–5) */
  calc.riskScore = (p, i) => (num(p) && num(i) ? num(p) * num(i) : 0);
  calc.riskLevel = (score) => { const s = num(score); if (s >= 20) return { id: 'muy-alto', label: 'Muy alto', tone: 'crit' }; if (s >= 10) return { id: 'alto', label: 'Alto', tone: 'signal' }; if (s >= 5) return { id: 'medio', label: 'Medio', tone: 'warn' }; if (s >= 1) return { id: 'bajo', label: 'Bajo', tone: 'good' }; return { id: 'sin', label: 'Sin evaluar', tone: 'outline' }; };

  /* ---------------------------------------------------------------- documentos */
  PM.DOC_STATUS = [
    { id: 'borrador', label: 'Borrador', tone: 'outline' },
    { id: 'revision', label: 'En revisión', tone: 'info' },
    { id: 'aprobado', label: 'Aprobado', tone: 'good' },
    { id: 'obsoleto', label: 'Obsoleto', tone: 'warn' },
  ];
  PM.docStatus = (id) => PM.DOC_STATUS.find((s) => s.id === id) || { id: 'sin', label: 'Sin iniciar', tone: 'outline' };
  /* Convención de planos: borradores A, B, C…; emisiones aprobadas 0, 1, 2…; borradores sobre la emisión n → (n+1)A, (n+1)B… */
  calc.nextDraftRev = (cur) => { if (!cur) return 'A'; let m; if ((m = /^([A-Y])$/.exec(cur))) return String.fromCharCode(m[1].charCodeAt(0) + 1); if (/^Z$/.test(cur)) return 'Z'; if ((m = /^(\d+)$/.exec(cur))) return Number(m[1]) + 1 + 'A'; if ((m = /^(\d+)([A-Y])$/.exec(cur))) return m[1] + String.fromCharCode(m[2].charCodeAt(0) + 1); return 'A'; };
  calc.approvedRev = (cur) => { if (!cur || /^[A-Z]$/.test(cur)) return '0'; let m; if ((m = /^(\d+)$/.exec(cur))) return String(Number(m[1]) + 1); if ((m = /^(\d+)[A-Z]$/.exec(cur))) return m[1]; return '0'; };
  /* Valor por defecto de un campo de plantilla tomando datos del proyecto (field.from = 'project.<campo>') */
  calc.fieldDefault = (field, project) => { if (field && typeof field.from === 'string' && field.from.startsWith('project.') && project) { const v = project[field.from.slice(8)]; return v === undefined ? undefined : v; } return undefined; };
})();

</script>
<script>
/* ==========================================================================
   06-model.js — modelos compartidos entre vistas: cronograma/EDT/costos
   calculados, índice de documentos del proyecto y acceso a tablas de
   documentos (registro de riesgos, interesados, etc.).
   ========================================================================== */
(function () {
  'use strict';
  const PM = window.PM;
  const { useMemo, useCallback } = PM.lib;

  PM.EMPTY = PM.deepFreeze({
    wbs: { nodes: [] },
    schedule: { settings: { workweek: 5, holidaysCO: true, extraHolidays: [] }, tasks: [] },
    costs: { actuals: [], statusUpdates: [], reserves: { contingency: 0, management: 0 } },
    raci: { roles: [], rows: [] },
    quality: { ishikawa: [], pareto: [] },
  });

  /* Fecha de corte del proyecto (project.statusDate) o, si no hay, hoy. */
  PM.statusDateOf = (project) => (project && PM.date.valid(project.statusDate) ? project.statusDate : PM.date.today());

  /* Marca el proyecto como actualizado (con antirrebote por proyecto). */
  const touchers = {};
  PM.touchProject = (pid) => { if (!pid || !PM.getState().canWrite) return; (touchers[pid] = touchers[pid] || PM.debounce(() => PM.projectOps.touch(pid), 8000))(); };

  /* Modelo integrado del proyecto actual: EDT, cronograma (CPM), costos, líneas base y valor ganado. */
  PM.useProjectModel = function () {
    const { project } = PM.useCurrentProject();
    const pid = project ? project.id : null;
    const [schedule, saveScheduleRaw, sMeta] = PM.useToolData('schedule', PM.EMPTY.schedule);
    const [wbs, saveWbsRaw, wMeta] = PM.useToolData('wbs', PM.EMPTY.wbs);
    const [costs, saveCostsRaw, cMeta] = PM.useToolData('costs', PM.EMPTY.costs);
    const { docs: baselineDocs, loading: blLoading } = PM.useCollection(pid ? PM.paths.baselines(pid) : null);
    const saveSchedule = useCallback((v) => { PM.touchProject(pid); return saveScheduleRaw(v); }, [saveScheduleRaw, pid]);
    const saveWbs = useCallback((v) => { PM.touchProject(pid); return saveWbsRaw(v); }, [saveWbsRaw, pid]);
    const saveCosts = useCallback((v) => { PM.touchProject(pid); return saveCostsRaw(v); }, [saveCostsRaw, pid]);
    const projectStart = project ? project.start : null;
    const statusDate = PM.statusDateOf(project);
    const tree = useMemo(() => PM.calc.wbsTree(wbs.nodes), [wbs]);
    const sched = useMemo(() => PM.calc.computeSchedule(schedule, projectStart), [schedule, projectStart]);
    const baselines = useMemo(() => PM.calc.activeBaselines(baselineDocs), [baselineDocs]);
    const evm = useMemo(() => PM.calc.evm({ sched, costBaseline: baselines.cost, costs, statusDate }), [sched, baselines.cost, costs, statusDate]);
    const rollup = useMemo(() => PM.calc.rollupWbs(tree, sched), [tree, sched]);
    return { project, pid, schedule, saveSchedule, wbs, saveWbs, costs, saveCosts, tree, sched, baselines, baselineDocs, evm, rollup, statusDate, currency: (project && project.currency) || 'COP', loading: sMeta.loading || wMeta.loading || cMeta.loading || blLoading };
  };

  /* Índice de documentos del proyecto actual. list: [{id, template, title, status, rev, fields, ...}] */
  PM.docTemplateOf = (docId, data) => (data && data.template) || String(docId).split('--')[0];
  PM.useProjectDocs = function () {
    const st = PM.useAppState();
    const { docs, loading } = PM.useCollection(st.projectId ? PM.paths.docs(st.projectId) : null);
    return useMemo(() => {
      const list = docs.filter((d) => d.data).map((d) => ({ id: d.id, ...d.data, template: PM.docTemplateOf(d.id, d.data) }));
      const byTemplate = {};
      for (const d of list) (byTemplate[d.template] = byTemplate[d.template] || []).push(d);
      return { list, byTemplate, get: (tid) => (byTemplate[tid] && byTemplate[tid][0]) || null, loading };
    }, [docs, loading]);
  };

  /* Cuerpo inicial de un documento a partir de su plantilla. */
  PM.newDocBody = (template, project, extra = {}) => {
    const fields = {};
    for (const s of (template && template.sections) || []) for (const f of s.fields || []) {
      const v = PM.calc.fieldDefault(f, project);
      if (v !== undefined && v !== null && v !== '') fields[f.key] = v;
      else if (f.type === 'table' && Array.isArray(f.defaultRows)) fields[f.key] = f.defaultRows.map((r) => ({ id: PM.uid('r'), ...r }));
      else if (f.default !== undefined) fields[f.key] = PM.clone(f.default);
    }
    const now = PM.nowIso();
    return { template: template ? template.id : extra.template, title: template ? template.name : '', status: 'borrador', rev: null, fields, titleBlock: { codigo: '', elaboro: '', reviso: '', aprobo: '', fechaAprobacion: null }, createdAt: now, updatedAt: now, createdBy: PM.getState().meId || null, updatedBy: PM.getState().meId || null, ...extra };
  };

  /* Tabla de un documento (singleton) del proyecto actual: [rows, saveRows, {doc, exists, loading}].
     Crea el documento con su plantilla si no existe al guardar. Comparte la sincronización con el editor. */
  PM.useDocTable = function (templateId, fieldKey) {
    const { project } = PM.useCurrentProject();
    const pid = project ? project.id : null;
    const r = PM.useDoc(pid ? PM.paths.doc(pid, templateId) : null);
    const rows = (r.exists && r.data && r.data.fields && Array.isArray(r.data.fields[fieldKey])) ? r.data.fields[fieldKey] : [];
    const saveRows = useCallback((next) => {
      const base = r.exists && r.data ? PM.clone(r.data) : PM.newDocBody(PM.templates[templateId], project, { template: templateId });
      base.fields = { ...(base.fields || {}), [fieldKey]: next };
      base.updatedAt = PM.nowIso(); base.updatedBy = PM.getState().meId || null;
      PM.touchProject(pid);
      return r.save(base);
    }, [r.exists, r.data, r.save, templateId, fieldKey, pid, project]);
    return [rows, saveRows, { doc: r.exists ? r.data : null, exists: r.exists, loading: r.loading }];
  };
})();

</script>
<script>
/* ==========================================================================
   08-shell.js — armazón de la aplicación: riel de navegación, selector de
   proyecto, avisos de modo, anfitrión de vistas, portafolio y formulario de
   proyecto (PM.ProjectForm, reutilizable).
   ========================================================================== */
(function () {
  'use strict';
  const PM = window.PM;
  const { html, useState, useEffect, useRef, useMemo } = PM.lib;
  const ui = PM.ui;

  const BrandMark = () => html`<svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="2.5" y="2.5" width="27" height="27" rx="2.5" />
    <path d="M2.5 22h27M13 22v7.5M21 22v7.5" stroke-width="1.6" />
    <path d="M7 17.5c3.2 0 4.4-1 6-4.2s3-6.3 7.5-6.3H25" />
    <path d="m22.5 4.5 2.5 2.5-2.5 2.5" stroke-width="1.6" />
  </svg>`;

  /* ---------------------------------------------------------------- formulario de proyecto */
  PM.ProjectForm = function ProjectForm({ initial, projects, onSubmit, onCancel, submitText = 'Crear proyecto' }) {
    const [f, setF] = useState(() => ({ name: '', code: PM.nextProjectCode(projects || []), client: '', sponsor: '', manager: '', start: PM.date.today(), end: '', budget: null, currency: 'COP', status: 'En planificación', lifecycle: 'Predictivo', description: '', location: '', ...(initial || {}) }));
    const [touched, setTouched] = useState(false);
    const [busy, setBusy] = useState(false);
    const set = (k) => (v) => setF((x) => ({ ...x, [k]: v }));
    const errors = {};
    if (!String(f.name || '').trim()) errors.name = 'Escribe el nombre del proyecto.';
    if (!PM.date.valid(f.start)) errors.start = 'Indica la fecha de inicio.';
    if (f.end && PM.date.valid(f.start) && f.end < f.start) errors.end = 'La fecha de fin debe ser posterior al inicio.';
    const ok = !Object.keys(errors).length;
    const submit = async (e) => { e && e.preventDefault(); setTouched(true); if (!ok || busy) return; setBusy(true); try { await onSubmit({ ...f, name: f.name.trim(), code: String(f.code || '').trim() }); } finally { setBusy(false); } };
    return html`<form class="stack" onSubmit=${submit}>
      <div class="grid cols-2">
        <${ui.Field} label="Nombre del proyecto" required for="pf-name" error=${touched && errors.name} class="span-all"><${ui.Input} id="pf-name" value=${f.name} onValue=${set('name')} placeholder="Ej.: Suministro y montaje de andamio — Torre 2" autoFocus /></${ui.Field}>
        <${ui.Field} label="Código" for="pf-code" hint="Identificador corto para documentos y reportes."><${ui.Input} id="pf-code" class="mono" value=${f.code} onValue=${set('code')} /></${ui.Field}>
        <${ui.Field} label="Cliente" for="pf-client"><${ui.Input} id="pf-client" value=${f.client} onValue=${set('client')} /></${ui.Field}>
        <${ui.Field} label="Patrocinador" for="pf-sponsor"><${ui.Input} id="pf-sponsor" value=${f.sponsor} onValue=${set('sponsor')} /></${ui.Field}>
        <${ui.Field} label="Director del proyecto" for="pf-manager"><${ui.Input} id="pf-manager" value=${f.manager} onValue=${set('manager')} /></${ui.Field}>
        <${ui.Field} label="Fecha de inicio" required for="pf-start" error=${touched && errors.start}><${ui.DateInput} id="pf-start" value=${f.start} onValue=${set('start')} /></${ui.Field}>
        <${ui.Field} label="Fecha de fin prevista" for="pf-end" error=${errors.end}><${ui.DateInput} id="pf-end" value=${f.end} onValue=${set('end')} /></${ui.Field}>
        <${ui.Field} label="Presupuesto aprobado" for="pf-budget"><${ui.NumberInput} id="pf-budget" money currency=${f.currency} value=${f.budget} onValue=${set('budget')} /></${ui.Field}>
        <${ui.Field} label="Moneda" for="pf-cur"><${ui.Select} id="pf-cur" value=${f.currency} onValue=${set('currency')} options=${[{ value: 'COP', label: 'Peso colombiano (COP)' }, { value: 'USD', label: 'Dólar (USD)' }, { value: 'EUR', label: 'Euro (EUR)' }]} /></${ui.Field}>
        <${ui.Field} label="Estado" for="pf-status"><${ui.Select} id="pf-status" value=${f.status} onValue=${set('status')} options=${PM.PROJECT_STATUS} /></${ui.Field}>
        <${ui.Field} label="Ciclo de vida" for="pf-lc" hint="Enfoque de desarrollo del proyecto."><${ui.Select} id="pf-lc" value=${f.lifecycle} onValue=${set('lifecycle')} options=${PM.LIFECYCLES} /></${ui.Field}>
        <${ui.Field} label="Ubicación / obra" for="pf-loc"><${ui.Input} id="pf-loc" value=${f.location} onValue=${set('location')} /></${ui.Field}>
      </div>
      <${ui.Field} label="Descripción" for="pf-desc" hint="Qué se va a entregar y por qué. Se usa como punto de partida del acta de constitución."><${ui.TextArea} id="pf-desc" value=${f.description} onValue=${set('description')} rows=${3} /></${ui.Field}>
      <div class="row" style="justify-content:flex-end">
        ${onCancel ? html`<${ui.Button} onClick=${onCancel}>Cancelar</${ui.Button}>` : null}
        <${ui.Button} type="submit" variant="primary" disabled=${busy}>${busy ? 'Guardando…' : submitText}</${ui.Button}>
      </div>
    </form>`;
  };
  PM.openNewProject = (projects) => {
    PM.openModal((close) => html`<${ui.Modal} title="Nuevo proyecto" subtitle="Datos básicos. Podrás completarlos después en la ficha del proyecto." size="wide" onClose=${close}>
      <${PM.ProjectForm} projects=${projects} onCancel=${close} onSubmit=${async (data) => { const id = await PM.projectOps.create(data); close(); PM.toast('Proyecto creado.'); PM.selectProject(id, 'tablero'); }} />
    </${ui.Modal}>`);
  };
  PM.importProjectFile = () => {
    const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json';
    input.onchange = () => {
      const file = input.files && input.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try { const obj = JSON.parse(String(reader.result)); const id = await PM.projectOps.importData(obj); PM.toast('Proyecto importado.'); PM.selectProject(id, 'tablero'); }
        catch (e) { PM.toast(e && e.message && !e.code ? e.message : 'No se pudo importar el archivo. Verifica que sea una exportación del Gestor PMBOK.', { tone: 'crit' }); }
      };
      reader.readAsText(file);
    };
    input.click();
  };
  PM.exportProjectFile = async (pid, project) => {
    try { const data = await PM.projectOps.exportData(pid); await PM.download((project && project.code ? project.code + '_' : '') + PM.slug(project && project.name || 'proyecto') + '.json', JSON.stringify(data, null, 1)); }
    catch (e) { PM.toast('No se pudo exportar el proyecto.', { tone: 'crit' }); }
  };
  PM.deleteProjectFlow = async (p) => {
    const ok = await PM.confirm({ title: 'Eliminar proyecto', body: html`<div class="stack-sm"><p>Se eliminará <strong>${p.name}</strong> con todos sus documentos, herramientas y líneas base. Esta acción no se puede deshacer.</p><p class="small muted">Si quieres conservar una copia, exporta el proyecto antes de eliminarlo.</p></div>`, confirmText: 'Eliminar proyecto', tone: 'danger' });
    if (!ok) return;
    try { await PM.projectOps.remove(p.id); if (PM.getState().projectId === p.id) { PM.setState({ projectId: null }); PM.prefs.set('projectId', null); PM.navigate('portafolio'); } PM.toast('Proyecto eliminado.'); }
    catch (e) { PM.toast('No se pudo eliminar por completo el proyecto. Intenta de nuevo.', { tone: 'crit' }); }
  };
  PM.createExampleProject = async () => {
    if (!PM.exampleBuilders.length) return;
    try {
      const data = PM.exampleBuilders[0]({ today: PM.date.today() });
      const id = await PM.projectOps.importData(data);
      PM.toast('Proyecto de ejemplo creado.');
      PM.selectProject(id, 'tablero');
    } catch (e) { console.error(e); PM.toast('No se pudo crear el proyecto de ejemplo.', { tone: 'crit' }); }
  };

  /* ---------------------------------------------------------------- portafolio */
  function PortfolioView() {
    const { projects, loading } = PM.useProjects();
    const st = PM.useAppState();
    const [q, setQ] = useState('');
    const [status, setStatus] = useState('');
    const shown = projects.filter((p) => (!status || p.status === status) && (!q || (p.name + ' ' + (p.code || '') + ' ' + (p.client || '') + ' ' + (p.manager || '')).toLowerCase().includes(q.toLowerCase())));
    const counts = PM.groupBy(projects, (p) => p.status || 'Sin estado');
    const totalBudget = PM.sum(projects.filter((p) => (p.currency || 'COP') === 'COP' && p.status !== 'Cerrado'), (p) => p.budget);
    const canWrite = st.canWrite;
    const actions = html`
      ${canWrite ? html`<${ui.Button} icon="upload" onClick=${PM.importProjectFile}>Importar</${ui.Button}>` : null}
      ${canWrite ? html`<${ui.Button} variant="primary" icon="plus" onClick=${() => PM.openNewProject(projects)}>Nuevo proyecto</${ui.Button}>` : null}`;
    return html`<div class="page">
      <${ui.PageHeader} eyebrow="Portafolio" title="Proyectos" description="Crea un proyecto o selecciona uno para gestionar sus documentos, líneas base y herramientas según la Guía del PMBOK®." actions=${actions} />
      ${loading ? html`<${ui.Loading} rows=${4} />` : projects.length === 0 ? html`
        <${ui.Empty} icon="portfolio" title="Aún no hay proyectos" actions=${canWrite ? html`<${ui.Button} variant="primary" icon="plus" onClick=${() => PM.openNewProject(projects)}>Nuevo proyecto</${ui.Button}>${PM.exampleBuilders.length ? html`<${ui.Button} icon="sparkles" onClick=${PM.createExampleProject}>Crear proyecto de ejemplo</${ui.Button}>` : null}` : null}>
          Cada proyecto guarda su acta de constitución, planes, registros, EDT, cronograma, costos y líneas base. El proyecto de ejemplo muestra todas las herramientas con datos de muestra marcados como ejemplo.
        </${ui.Empty}>` : html`
        <div class="card"><div class="grid cols-4" style="gap:0">
          <${ui.Stat} label="Proyectos" value=${projects.length} sub=${(counts['En ejecución'] || []).length + ' en ejecución'} />
          <${ui.Stat} label="En planificación" value=${(counts['En planificación'] || []).length} sub=${(counts['Propuesta'] || []).length + ' propuestas'} />
          <${ui.Stat} label="Cerrados" value=${(counts['Cerrado'] || []).length} sub=${(counts['Suspendido'] || []).length + ' suspendidos'} />
          <${ui.Stat} label="Presupuesto activo (COP)" value=${PM.fmt.moneyShort(totalBudget)} sub="Proyectos no cerrados" title=${PM.fmt.money(totalBudget)} />
        </div></div>
        <div class="row">
          <div style="flex:1;min-width:200px;max-width:360px"><${ui.Search} value=${q} onValue=${setQ} placeholder="Buscar por nombre, código, cliente…" aria-label="Buscar proyectos" /></div>
          <div style="width:200px"><${ui.Select} value=${status} onValue=${setStatus} placeholder="Todos los estados" options=${PM.PROJECT_STATUS} aria-label="Filtrar por estado" /></div>
          <div class="spacer"></div>
          ${PM.exampleBuilders.length && canWrite ? html`<${ui.Button} variant="ghost" icon="sparkles" onClick=${PM.createExampleProject}>Crear proyecto de ejemplo</${ui.Button}>` : null}
        </div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Código</th><th>Proyecto</th><th>Director</th><th>Estado</th><th>Inicio</th><th>Fin previsto</th><th class="num">Presupuesto</th><th>Actualizado</th><th><span class="sr-only">Acciones</span></th></tr></thead>
          <tbody>
            ${shown.length === 0 ? html`<tr><td colspan="9" class="faint">Ningún proyecto coincide con el filtro.</td></tr>` : null}
            ${shown.map((p) => html`<tr key=${p.id} class="clickable" onClick=${(e) => { if (e.target.closest('.no-row-click')) return; PM.selectProject(p.id, 'tablero'); }}>
              <td class="mono nowrap">${p.code || '—'}</td>
              <td style="min-width:220px"><div style="font-weight:600">${p.name}</div>${p.client ? html`<div class="xsmall faint">${p.client}</div>` : null}</td>
              <td>${p.manager || html`<span class="faint">—</span>`}</td>
              <td><${ui.Chip} tone=${PM.statusTone(p.status)}>${p.status || 'Sin estado'}</${ui.Chip}></td>
              <td class="nowrap num">${PM.fmt.date(p.start)}</td>
              <td class="nowrap num">${PM.fmt.date(p.end)}</td>
              <td class="num nowrap">${PM.fmt.money(p.budget, p.currency)}</td>
              <td class="nowrap xsmall faint">${PM.fmt.datetime(p.updatedAt)}</td>
              <td class="no-row-click"><${ui.Dropdown} label=${'Acciones de ' + p.name} items=${[
                { label: 'Abrir tablero', icon: 'dashboard', onClick: () => PM.selectProject(p.id, 'tablero') },
                canWrite && { label: 'Duplicar', icon: 'copy', onClick: async () => { const id = await PM.projectOps.duplicate(p.id, p.name + ' (copia)'); PM.toast('Proyecto duplicado.'); PM.selectProject(id, 'tablero'); } },
                { label: 'Exportar (.json)', icon: 'download', onClick: () => PM.exportProjectFile(p.id, p) },
                canWrite && 'sep',
                canWrite && { label: 'Eliminar', icon: 'trash', danger: true, onClick: () => PM.deleteProjectFlow(p) },
              ]} /></td>
            </tr>`)}
          </tbody>
        </table></div>`}
    </div>`;
  }
  PM.registerView({ id: 'portafolio', label: 'Portafolio', group: 'portafolio', icon: 'portfolio', order: 0, needsProject: false, component: PortfolioView });

  /* ---------------------------------------------------------------- selector de proyecto */
  function ProjectSwitcher() {
    const st = PM.useAppState();
    const { projects } = PM.useProjects();
    const { project } = PM.useCurrentProject();
    const [open, setOpen] = useState(false);
    const ref = useRef();
    useEffect(() => { if (!open) return; const f = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; const k = (e) => { if (e.key === 'Escape') setOpen(false); }; document.addEventListener('mousedown', f); document.addEventListener('keydown', k); return () => { document.removeEventListener('mousedown', f); document.removeEventListener('keydown', k); }; }, [open]);
    return html`<div class="switcher" ref=${ref}>
      <button type="button" class="switcher-btn" aria-haspopup="listbox" aria-expanded=${open ? 'true' : 'false'} onClick=${() => setOpen(!open)}>
        <div style="flex:1;min-width:0">
          <div class="switcher-code">${project ? project.code || 'Proyecto' : 'Sin proyecto'}</div>
          <div class="switcher-name">${project ? project.name : 'Selecciona un proyecto'}</div>
        </div>
        <${ui.Icon} name="chevron-down" size=${16} />
      </button>
      ${open ? html`<div class="menu" role="listbox" style="top:calc(100% + 4px);left:0;right:0">
        <div class="menu-label">Proyectos</div>
        ${projects.length === 0 ? html`<div class="small faint" style="padding:6px 9px">No hay proyectos.</div>` : null}
        ${projects.map((p) => html`<button type="button" role="option" key=${p.id} class="menu-item" aria-selected=${p.id === st.projectId ? 'true' : 'false'} onClick=${() => { setOpen(false); PM.selectProject(p.id, st.view && st.view !== 'portafolio' ? st.view : 'tablero'); }}>
          <div style="min-width:0;flex:1"><div class="switcher-code">${p.code || ''}</div><div class="truncate" style="font-weight:500">${p.name}</div></div>
          ${p.id === st.projectId ? html`<${ui.Icon} name="check" size=${15} />` : null}
        </button>`)}
        <div class="menu-sep"></div>
        <button type="button" class="menu-item" onClick=${() => { setOpen(false); PM.navigate('portafolio'); }}><${ui.Icon} name="portfolio" size=${15} />Ver portafolio</button>
        ${st.canWrite ? html`<button type="button" class="menu-item" onClick=${() => { setOpen(false); PM.openNewProject(projects); }}><${ui.Icon} name="plus" size=${15} />Nuevo proyecto</button>` : null}
      </div>` : null}
    </div>`;
  }

  /* ---------------------------------------------------------------- riel */
  function Rail() {
    const st = PM.useAppState();
    const groups = PM.GROUPS.map((g) => ({ ...g, items: PM.views.filter((v) => v.group === g.id && !v.hidden) })).filter((g) => g.items.length);
    const savingLabel = st.saving > 0 ? 'Guardando…' : st.lastSaved ? 'Cambios guardados' : '';
    return html`<aside class="rail" aria-label="Navegación">
      <div class="rail-inner">
        <div class="brand"><${BrandMark} /><div><div class="brand-name">Gestor PMBOK</div><div class="brand-sub">Ingeniería y Alquiler</div></div></div>
        <${ProjectSwitcher} />
        <nav class="nav">
          ${groups.map((g) => html`<div key=${g.id}>
            ${g.id !== 'portafolio' ? html`<div class="nav-group-label">${g.label}</div>` : null}
            <div class="nav-list">
              ${g.items.map((v) => html`<button key=${v.id} type="button" class="nav-item" aria-current=${st.view === v.id ? 'page' : undefined} disabled=${v.needsProject && !st.projectId} title=${v.needsProject && !st.projectId ? 'Selecciona un proyecto primero' : v.description} onClick=${() => PM.navigate(v.id)}>
                <${ui.Icon} name=${v.icon} size=${17} /><span>${v.label}</span>
              </button>`)}
            </div>
          </div>`)}
        </nav>
      </div>
      <div class="rail-foot stack-sm">
        <div class="row" style="gap:6px;color:var(--fg-2)"><${ui.Icon} name=${st.mode === 'db' ? 'cloud' : 'device'} size=${14} />
          <span>${st.mode === 'db' ? 'Datos guardados en el artefacto' : st.mode === 'local' ? 'Datos solo en este navegador' : 'Conectando…'}</span></div>
        ${savingLabel ? html`<div class="faint" aria-live="polite">${savingLabel}</div>` : null}
        <div>PMBOK® es una marca registrada del Project Management Institute, Inc. Herramienta independiente basada en la Guía del PMBOK® (6.ª edición).</div>
      </div>
    </aside>`;
  }

  function Banners() {
    const st = PM.useAppState();
    return html`<div>
      ${st.mode === 'local' ? html`<div class="banner"><${ui.Icon} name="device" size=${15} /><div>Modo local: los proyectos se guardan solo en este navegador. Abre la página en claude.ai con tu sesión iniciada para guardarlos en el artefacto, o usa <strong>Exportar</strong> para respaldarlos.</div></div>` : null}
      ${st.mode === 'db' && !st.canWrite ? html`<div class="banner warn"><${ui.Icon} name="lock" size=${15} /><div>Solo lectura: puedes consultar los proyectos, pero tu nivel de acceso no permite modificarlos.</div></div>` : null}
      ${st.storageWarning ? html`<div class="banner warn"><${ui.Icon} name="alert" size=${15} /><div>${st.storageWarning}</div></div>` : null}
    </div>`;
  }

  function NoProject() {
    const { projects, loading } = PM.useProjects();
    if (loading) return html`<${ui.Loading} />`;
    return html`<div class="page"><${ui.Empty} icon="folder" title="Selecciona un proyecto" actions=${html`<${ui.Button} variant="primary" icon="portfolio" onClick=${() => PM.navigate('portafolio')}>Ir al portafolio</${ui.Button}>`}>
      Esta sección trabaja sobre un proyecto. ${projects.length ? 'Elige uno en el selector de la izquierda o en el portafolio.' : 'Crea tu primer proyecto en el portafolio.'}
    </${ui.Empty}></div>`;
  }

  function ViewHost() {
    const st = PM.useAppState();
    const { project, loading } = PM.useCurrentProject();
    const view = PM.getView(st.view) || PM.getView('portafolio');
    useEffect(() => { document.title = (view ? view.label + ' · ' : '') + 'Gestor de Proyectos PMBOK'; }, [view && view.id]);
    if (st.mode === 'loading') return html`<div class="page"><${ui.Spinner} label="Conectando con el almacenamiento…" /><${ui.Loading} rows=${4} /></div>`;
    if (!view) return null;
    if (view.needsProject) {
      if (!st.projectId) return html`<${NoProject} />`;
      if (loading) return html`<div class="page"><${ui.Loading} rows=${5} /></div>`;
      if (!project) return html`<div class="page"><${ui.Empty} icon="folder" title="El proyecto ya no existe" actions=${html`<${ui.Button} variant="primary" onClick=${() => { PM.setState({ projectId: null }); PM.prefs.set('projectId', null); PM.navigate('portafolio'); }}>Ir al portafolio</${ui.Button}>`}>Puede que otra persona lo haya eliminado.</${ui.Empty}></div>`;
    }
    const C = view.component;
    return html`<${ui.ErrorBoundary} key=${view.id + ':' + st.projectId} label=${view.id}><${C} project=${project} params=${st.params || {}} /></${ui.ErrorBoundary}>`;
  }

  function TopBar() {
    const st = PM.useAppState();
    const { project } = PM.useCurrentProject();
    const view = PM.getView(st.view);
    return html`<div class="topbar">
      <${ui.IconButton} icon="menu" label="Abrir menú" onClick=${() => PM.setState({ navOpen: true })} />
      <div style="min-width:0;flex:1"><div class="topbar-title">${view ? view.label : ''}</div>${project ? html`<div class="xsmall faint truncate">${project.code ? project.code + ' · ' : ''}${project.name}</div>` : null}</div>
    </div>`;
  }

  PM.App = function App() {
    const st = PM.useAppState();
    useEffect(() => {
      const onHash = () => { const v = location.hash.slice(1); if (v && PM.getView(v) && v !== PM.getState().view) PM.setState({ view: v, params: {} }); };
      window.addEventListener('hashchange', onHash);
      return () => window.removeEventListener('hashchange', onHash);
    }, []);
    return html`<div class=${'app' + (st.navOpen ? ' nav-open' : '')}>
      <${Rail} />
      ${st.navOpen ? html`<div class="scrim" onClick=${() => PM.setState({ navOpen: false })}></div>` : null}
      <main class="main">
        <${TopBar} />
        <${Banners} />
        <div class="view-host"><${ViewHost} /></div>
      </main>
      <${ui.OverlayHost} />
    </div>`;
  };
})();

</script>
<script>
/* ==========================================================================
   99-boot.js — arranque: restaura proyecto/vista recordados y monta la app.
   ========================================================================== */
(function () {
  'use strict';
  const PM = window.PM;
  const hashView = location.hash.slice(1);
  const savedView = PM.prefs.get('view', 'portafolio');
  const view = (hashView && PM.getView(hashView) && hashView) || (PM.getView(savedView) && savedView) || 'portafolio';
  PM.setState({ projectId: PM.prefs.get('projectId', null), view, params: {} });
  PM.boot();
  PM.lib.render(PM.html`<${PM.App} />`, document.getElementById('app'));
})();

</script>
