<title>Gestor de Proyectos PMBOK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: plano de ingeniería — riel fijo a la izquierda (proyecto + navegación) y lienzo de trabajo a la derecha;
   los documentos llevan cajetín (rótulo) como un plano, los datos van en mono tabular. */
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --surface-3: #e7ebf0;
  --line: #d6dce4;
  --line-strong: #b3bdc9;
  --fg: #141c28;
  --fg-2: #485464;
  --fg-3: #758091;
  --accent: #2147b0;
  --accent-hover: #1a3a93;
  --accent-wash: #e6ecfa;
  --accent-fg: #ffffff;
  --signal: #c45a00;
  --signal-wash: #fbeee2;
  --good: #137a3a;
  --good-wash: #e3f2e8;
  --warn: #9a5c00;
  --warn-wash: #fbf0d9;
  --crit: #c0262a;
  --crit-wash: #fae6e6;
  --info: #22659a;
  --info-wash: #e3eef7;
  --grid: #e3e7ec;
  --axis: #b3bdc9;
  --rail: #f8f9fb;
  /* series (categóricas, orden fijo) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  /* grupos de procesos */
  --g-inicio: #2a78d6; --g-planificacion: #eb6834; --g-ejecucion: #1baf7a; --g-monitoreo: #eda100; --g-cierre: #4a3aa7;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --fs-xs: 0.75rem; --fs-sm: 0.8125rem; --fs-md: 0.875rem; --fs-lg: 1rem; --fs-xl: 1.25rem; --fs-2xl: 1.625rem; --fs-3xl: 2.125rem;
  --r-sm: 3px; --r-md: 6px; --r-lg: 10px;
  --shadow-pop: 0 10px 30px rgba(18, 28, 45, 0.16), 0 1px 3px rgba(18, 28, 45, 0.08);
  --shadow-card: 0 1px 2px rgba(18, 28, 45, 0.06);
  --rail-w: 252px;
  --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218; --surface: #151c25; --surface-2: #1a222d; --surface-3: #222c39; --line: #2a3542; --line-strong: #3d4a5b;
    --fg: #e5eaf0; --fg-2: #a9b3c0; --fg-3: #7c8796;
    --accent: #85a2ff; --accent-hover: #a3b9ff; --accent-wash: #1c2847; --accent-fg: #0a1020;
    --signal: #f2953f; --signal-wash: #3a2513;
    --good: #45cc76; --good-wash: #12301e; --warn: #f0b443; --warn-wash: #392a0e; --crit: #ff6f6b; --crit-wash: #3d1819;
    --info: #6cb3ea; --info-wash: #13293b; --grid: #232d39; --axis: #3d4a5b; --rail: #111821;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --g-inicio: #3987e5; --g-planificacion: #d95926; --g-ejecucion: #199e70; --g-monitoreo: #c98500; --g-cierre: #9085e9;
    --shadow-pop: 0 12px 34px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218; --surface: #151c25; --surface-2: #1a222d; --surface-3: #222c39; --line: #2a3542; --line-strong: #3d4a5b;
  --fg: #e5eaf0; --fg-2: #a9b3c0; --fg-3: #7c8796;
  --accent: #85a2ff; --accent-hover: #a3b9ff; --accent-wash: #1c2847; --accent-fg: #0a1020;
  --signal: #f2953f; --signal-wash: #3a2513;
  --good: #45cc76; --good-wash: #12301e; --warn: #f0b443; --warn-wash: #392a0e; --crit: #ff6f6b; --crit-wash: #3d1819;
  --info: #6cb3ea; --info-wash: #13293b; --grid: #232d39; --axis: #3d4a5b; --rail: #111821;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --g-inicio: #3987e5; --g-planificacion: #d95926; --g-ejecucion: #199e70; --g-monitoreo: #c98500; --g-cierre: #9085e9;
  --shadow-pop: 0 12px 34px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: var(--fs-md); line-height: 1.5; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }
::selection { background: var(--accent-wash); }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 700; text-wrap: balance; letter-spacing: -0.005em; }
p { margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

/* ---------- shell ---------- */
#app { min-height: 100%; }
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; height: 100dvh; overflow-y: auto; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; padding-block: 16px 20px; }
.rail-inner { display: flex; flex-direction: column; gap: 14px; padding-inline: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding-inline: 4px; }
.brand-mark { width: 30px; height: 30px; flex: none; color: var(--accent); }
.brand-name { font-family: var(--font-display); font-weight: 750; font-stretch: 112%; font-size: 1.02rem; line-height: 1.1; letter-spacing: 0.01em; }
.brand-sub { font-size: var(--fs-xs); color: var(--fg-3); line-height: 1.2; }
.nav { display: flex; flex-direction: column; gap: 14px; }
.nav-group-label { font-size: 0.6875rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; padding: 0 8px 4px; }
.nav-list { display: flex; flex-direction: column; gap: 1px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 6px 8px; border: 0; background: transparent; border-radius: var(--r-md); color: var(--fg-2); cursor: pointer; font-size: var(--fs-md); line-height: 1.3; }
.nav-item:hover { background: var(--surface-3); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--accent-wash); color: var(--accent); font-weight: 600; }
.nav-item[disabled] { opacity: 0.45; cursor: not-allowed; }
.nav-item .icon { flex: none; }
.rail-foot { margin-top: auto; padding-inline: 18px; font-size: 0.6875rem; color: var(--fg-3); line-height: 1.45; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; }
.view-host { padding: 22px 28px 48px; min-width: 0; flex: 1; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 8px 28px; font-size: var(--fs-sm); border-bottom: 1px solid var(--line); background: var(--surface-2); color: var(--fg-2); }
.banner.warn { background: var(--warn-wash); color: var(--fg); }
.banner .icon { flex: none; margin-top: 2px; }

.switcher { position: relative; }
.switcher-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); cursor: pointer; text-align: left; }
.switcher-btn:hover { border-color: var(--line-strong); }
.switcher-code { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--fg-3); letter-spacing: 0.02em; }
.switcher-name { font-weight: 600; font-size: var(--fs-sm); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.menu { position: absolute; z-index: 40; min-width: 100%; max-width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-pop); padding: 6px; display: flex; flex-direction: column; gap: 2px; max-height: 60vh; overflow-y: auto; }
.menu-item { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: var(--r-sm); border: 0; background: transparent; cursor: pointer; text-align: left; width: 100%; color: var(--fg); font-size: var(--fs-sm); }
.menu-item:hover, .menu-item[aria-selected="true"] { background: var(--surface-3); }
.menu-sep { height: 1px; background: var(--line); margin: 4px 2px; }
.menu-label { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); padding: 6px 9px 2px; font-weight: 600; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; height: auto; width: min(300px, 86vw); transform: translateX(-102%); transition: transform 0.2s ease; box-shadow: var(--shadow-pop); padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
  .app.nav-open .rail { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, 0.45); z-index: 55; }
  .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 16px; }
  .topbar-title { font-weight: 600; font-size: var(--fs-sm); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .view-host { padding: 16px 16px 40px; }
  .banner { padding: 8px 16px; }
}

/* ---------- page scaffolding ---------- */
.page { display: flex; flex-direction: column; gap: 20px; max-width: 1480px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.page-head-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 820px; }
.eyebrow { font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.page-title { font-size: var(--fs-2xl); font-stretch: 108%; line-height: 1.15; }
.page-desc { color: var(--fg-2); max-width: 70ch; }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.h2 { font-size: var(--fs-xl); font-stretch: 105%; }
.h3 { font-size: var(--fs-lg); font-stretch: 102%; font-weight: 650; }
.h4 { font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 600; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: var(--fs-sm); }
.xsmall { font-size: var(--fs-xs); }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.label-caps { font-size: 0.6875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-card); min-width: 0; }
.card-pad { padding: 16px 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-body { padding: 16px; min-width: 0; }
.sheet { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm); min-width: 0; }

.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-width: 0; }
.spacer { flex: 1; }
.grid { display: grid; gap: 16px; min-width: 0; }
.grid > * { min-width: 0; }
.grid > .span-all { grid-column: 1 / -1; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cols-auto { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
@media (max-width: 1100px) { .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 680px) { .cols-2, .cols-3, .cols-4 { grid-template-columns: minmax(0, 1fr); } }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 6px 12px; min-height: 32px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); font-weight: 500; font-size: var(--fs-sm); cursor: pointer; white-space: nowrap; line-height: 1.2; text-decoration: none; }
.btn:hover { background: var(--surface-2); border-color: var(--fg-3); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn-ghost:hover { background: var(--surface-3); color: var(--fg); border-color: transparent; }
.btn-danger { color: var(--crit); border-color: var(--line-strong); }
.btn-danger:hover { background: var(--crit-wash); border-color: var(--crit); }
.btn-danger-solid { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn-sm { min-height: 26px; padding: 3px 8px; font-size: var(--fs-xs); gap: 5px; }
.btn-icon { padding: 5px; min-width: 32px; }
.btn-sm.btn-icon { padding: 3px; min-width: 26px; }
.btn-group { display: inline-flex; }
.btn-group > .btn { border-radius: 0; margin-left: -1px; }
.btn-group > .btn:first-child { border-radius: var(--r-md) 0 0 var(--r-md); margin-left: 0; }
.btn-group > .btn:last-child { border-radius: 0 var(--r-md) var(--r-md) 0; }
.btn-group > .btn[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); border-color: var(--accent); position: relative; z-index: 1; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: var(--fs-sm); font-weight: 600; color: var(--fg); display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.field-label .req { color: var(--crit); }
.field-hint { font-size: var(--fs-xs); color: var(--fg-3); line-height: 1.4; }
.field-error { font-size: var(--fs-xs); color: var(--crit); }
.input, .select, .textarea { width: 100%; min-width: 0; padding: 6px 9px; min-height: 32px; border: 1px solid var(--line-strong); border-radius: var(--r-md); background: var(--surface); color: var(--fg); font-size: var(--fs-md); line-height: 1.4; }
.input:hover, .select:hover, .textarea:hover { border-color: var(--fg-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.input[readonly], .textarea[readonly], .input:disabled, .select:disabled, .textarea:disabled { background: var(--surface-2); color: var(--fg-2); cursor: default; }
.textarea { resize: vertical; min-height: 64px; }
.input.num, .input[type="number"] { font-variant-numeric: tabular-nums; }
.select { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%); background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: var(--fs-sm); }
.check input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
.search { position: relative; }
.search .input { padding-left: 30px; }
.search .icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--fg-3); pointer-events: none; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 500; line-height: 1.6; background: var(--surface-3); color: var(--fg-2); white-space: nowrap; border: 1px solid transparent; }
.chip-accent { background: var(--accent-wash); color: var(--accent); }
.chip-good { background: var(--good-wash); color: var(--good); }
.chip-warn { background: var(--warn-wash); color: var(--warn); }
.chip-crit { background: var(--crit-wash); color: var(--crit); }
.chip-info { background: var(--info-wash); color: var(--info); }
.chip-signal { background: var(--signal-wash); color: var(--signal); }
.chip-outline { background: transparent; border-color: var(--line-strong); color: var(--fg-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; background: currentColor; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; display: inline-block; }
.code-tag { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--fg-2); background: var(--surface-3); border-radius: var(--r-sm); padding: 0 5px; line-height: 1.6; white-space: nowrap; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tab { border: 0; background: transparent; padding: 8px 12px; font-size: var(--fs-sm); color: var(--fg-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab .count { font-size: 0.6875rem; color: var(--fg-3); font-family: var(--font-mono); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
.toolbar-sep { width: 1px; align-self: stretch; background: var(--line); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); max-width: 100%; }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.table th { text-align: left; font-weight: 600; font-size: var(--fs-xs); color: var(--fg-2); background: var(--surface-2); padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; z-index: 1; letter-spacing: 0.01em; }
.table td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: var(--surface-2); }
.table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table .clickable { cursor: pointer; }
.table-tight td { padding: 4px 8px; }
.table-edit td { padding: 3px 4px; vertical-align: middle; }
.table-edit td.ctl { width: 1%; white-space: nowrap; }
.cell-input { width: 100%; min-width: 72px; border: 1px solid transparent; background: transparent; border-radius: var(--r-sm); padding: 4px 6px; font-size: var(--fs-sm); line-height: 1.35; color: var(--fg); min-height: 28px; }
.cell-input:hover { border-color: var(--line); background: var(--surface); }
.cell-input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 2px var(--accent-wash); }
